[project]
name = "agentfish"
version = "0.4.1"
description = "CLI tool to install complete AI agent configuration bundles from any git repository"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "pimentelleo" }]
keywords = ["ai", "agents", "cli", "configuration", "copilot", "claude", "cursor", "coding-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/pimentelleo/agentfish"
Repository = "https://github.com/pimentelleo/agentfish"
Issues = "https://github.com/pimentelleo/agentfish/issues"

[project.scripts]
agentfish = "agentfish.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentfish"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
